<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icônes de FeuillureRainure</title>
<!--
  Source de l'icône de FeuillureRainure (bouton, ligne de timeline, commande de réédition).
  `generer_icones.py` photographie cette page (fond transparent) à chaque taille de pixel (`?taille=32` : côté
  d'une case), découpe chaque case et écrit les PNG dans FeuillureRainure/ressources/icone/. Ligne du haut :
  thème clair ; du bas : thème sombre. Deux dessins : `icone-32` (32x32, 64x64 et leurs @2x) et `icone-16`,
  redessiné sur une grille de 16 (16x16 et 16x16@2x), jamais réduit.

  Design system « Icônes Fusion natives » : projection cavalière (profondeur à 45°), faces grises #F3F3F3 /
  #D9D9D9 / #BBBBBB, usinage en bleu résultat #89CBFA / #67B1E6 / #4795CC (sombre : #B2DFFF / #89CBFA / #67B1E6),
  contour d'une unité #666666 en clair, aucun en sombre. Ni lettre ni texte.

  Dessin : un panneau de trois quarts, une rainure qui le traverse d'avant en arrière ; le fond et la joue
  visible de la rainure sont en bleu (l'usinage que fait le plugin).
-->
<style>
  html, body { margin: 0; background: transparent; }
  .ligne { display: flex; flex-wrap: nowrap; }
  .ligne svg { width: var(--taille); height: var(--taille); display: block; flex: none; }
  .clair { --dessus: #f3f3f3; --face: #d9d9d9; --flanc: #bbbbbb; --contour: #666666;
           --b-dessus: #89cbfa; --b-face: #67b1e6; --b-flanc: #4795cc; }
  .sombre { --dessus: #f3f3f3; --face: #d9d9d9; --flanc: #bbbbbb; --contour: transparent;
            --b-dessus: #b2dfff; --b-face: #89cbfa; --b-flanc: #67b1e6; }
  .dessus { fill: var(--dessus); }
  .face { fill: var(--face); }
  .flanc { fill: var(--flanc); }
  .b-dessus { fill: var(--b-dessus); }
  .b-flanc { fill: var(--b-flanc); }
  .contour { fill: none; stroke: var(--contour); stroke-width: 1; stroke-linejoin: round; }
</style>
</head>
<body>
<template id="icones">
  <!-- icone-32 : panneau de trois quarts (face 22 x 14, profondeur 8) traversé par une rainure de 6 x 6 -->
  <svg viewBox="0 0 32 32" data-nom="icone-32">
    <path class="b-dessus" d="M8.5,23.5 H14.5 L22.5,15.5 H16.5 Z"/>
    <path class="b-flanc" d="M8.5,17.5 L16.5,9.5 V15.5 L8.5,23.5 Z"/>
    <path class="dessus" d="M0.5,17.5 L8.5,9.5 H16.5 L8.5,17.5 Z"/>
    <path class="dessus" d="M14.5,17.5 L22.5,9.5 H31.5 L23.5,17.5 Z"/>
    <path class="flanc" d="M23.5,17.5 L31.5,9.5 V23.5 L23.5,31.5 Z"/>
    <path class="face" d="M0.5,17.5 H8.5 V23.5 H14.5 V17.5 H23.5 V31.5 H0.5 Z"/>
    <path class="contour" d="M0.5,17.5 L8.5,9.5 H31.5 V23.5 L23.5,31.5 H0.5 Z M8.5,17.5 V23.5 H14.5 V17.5 M8.5,17.5 L16.5,9.5 M14.5,17.5 L22.5,9.5 M23.5,17.5 L31.5,9.5 M23.5,17.5 V31.5 M0.5,17.5 H8.5 M14.5,17.5 H23.5"/>
  </svg>
  <!-- icone-16 : le même, sur une grille de 16 (face 11 x 7, profondeur 4, rainure 3 x 3) -->
  <svg viewBox="0 0 16 16" data-nom="icone-16">
    <path class="b-dessus" d="M4.5,11.5 H7.5 L11.5,7.5 H8.5 Z"/>
    <path class="b-flanc" d="M4.5,8.5 L8.5,4.5 V7.5 L4.5,11.5 Z"/>
    <path class="dessus" d="M0.5,8.5 L4.5,4.5 H8.5 L4.5,8.5 Z"/>
    <path class="dessus" d="M7.5,8.5 L11.5,4.5 H15.5 L11.5,8.5 Z"/>
    <path class="flanc" d="M11.5,8.5 L15.5,4.5 V11.5 L11.5,15.5 Z"/>
    <path class="face" d="M0.5,8.5 H4.5 V11.5 H7.5 V8.5 H11.5 V15.5 H0.5 Z"/>
    <path class="contour" d="M0.5,8.5 L4.5,4.5 H15.5 V11.5 L11.5,15.5 H0.5 Z M4.5,8.5 V11.5 H7.5 V8.5 M11.5,8.5 V15.5"/>
  </svg>
</template>
<div class="ligne clair"></div>
<div class="ligne sombre"></div>
<script>
  // ?taille=32 : côté d'une case en px ; une ligne par thème
  const taille = new URLSearchParams(location.search).get("taille") || "32";
  document.documentElement.style.setProperty("--taille", taille + "px");
  for (const ligne of document.querySelectorAll(".ligne"))
    ligne.appendChild(document.getElementById("icones").content.cloneNode(true));
</script>
</body>
</html>
